<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Usamos la versión específica del SDK para evitar fallos de carga -->
    <script src="https://unpkg.com/@owlbear-rodeo/sdk@latest/dist/obr-sdk.js"></script>
</head>
<body style="background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
    
    <h1 id="status" style="color: #d4af37;">ESTADO: Iniciando...</h1>
    <div id="debug-box" style="background: #000; padding: 15px; border-radius: 5px; text-align: left; font-family: monospace; font-size: 12px;">
        <p id="step-1">○ Esperando SDK...</p>
        <p id="step-2">○ Intentando Handshake (onReady)...</p>
        <p id="step-3">○ Obteniendo datos del jugador...</p>
    </div>

    <script>
        const statusH1 = document.getElementById("status");
        const step1 = document.getElementById("step-1");
        const step2 = document.getElementById("step-2");
        const step3 = document.getElementById("step-3");

        console.log("DIAGNOSIS: Script ejecutándose");

        // 1. Comprobar si la librería cargó
        if (typeof OBR === 'undefined') {
            statusH1.innerText = "ERROR: SDK NO CARGADO";
            step1.innerText = "✖ Error: No se pudo descargar la librería de unpkg.";
            step1.style.color = "red";
        } else {
            step1.innerText = "✔ Librería SDK detectada correctamente.";
            step1.style.color = "lightgreen";

            // 2. Temporizador de seguridad (si en 5 seg no conecta, es el protocolo)
            const timeout = setTimeout(() => {
                if (statusH1.innerText === "ESTADO: Iniciando...") {
                    statusH1.innerText = "ERROR DE CONEXIÓN";
                    step2.innerHTML = "✖ El Handshake falló. <br><br><b>CAUSA PROBABLE:</b><br>- Estás abriendo el archivo localmente (file://).<br>- Debes usar un servidor local (http://localhost:5500).";
                    step2.style.color = "orange";
                }
            }, 5000);

            // 3. Intentar conexión oficial
            OBR.onReady(async () => {
                clearTimeout(timeout);
                console.log("DIAGNOSIS: onReady ejecutado con éxito");
                step2.innerText = "✔ Handshake completado con Owlbear Rodeo.";
                step2.style.color = "lightgreen";

                try {
                    const name = await OBR.player.getName();
                    const role = await OBR.player.getRole();
                    const id = await OBR.player.getId();

                    statusH1.innerText = "¡CONECTADO!";
                    step3.innerHTML = `✔ Datos recibidos:<br> > NOMBRE: ${name}<br> > ROL: ${role}<br> > ID: ${id}`;
                    step3.style.color = "lightgreen";
                    
                    document.body.style.border = role === "GM" ? "4px solid #d4af37" : "4px solid #00ff00";
                } catch (e) {
                    step3.innerText = "✖ Error al pedir datos: " + e.message;
                    step3.style.color = "red";
                }
            });
        }
    </script>
</body>
</html>
