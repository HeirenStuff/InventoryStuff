<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBR Player Info</title>
  <style>
    /* Diseño compacto y oscuro estilo Owlbear */
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #242424;
      color: #eee;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #container {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      background: #333;
      border: 1px solid #444;
      min-width: 160px;
    }
    .role-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: block;
      color: #aaa;
    }
    .role-name {
      font-weight: bold;
      font-size: 1.2rem;
    }
    /* Colores por rol */
    .gm { color: #bb86fc; }      /* Morado para DM */
    .player { color: #03dac6; }  /* Turquesa para Jugador */
  </style>
</head>
<body>

  <div id="container">
    <div id="app">Cargando SDK local...</div>
  </div>

  <!-- Referencia al archivo que copiaste de node_modules -->
  <script src="./obr-sdk.js"></script>

  <script>
    // Referencia al div donde inyectaremos la info
    const app = document.getElementById('app');

    // Función que consulta la API de OBR y actualiza el HTML
    async function updateUI() {
      try {
        const role = await OBR.player.getRole();
        const name = await OBR.player.getName();

        if (role === "GM") {
          app.innerHTML = `
            <span class="role-label">Tu Rol</span>
            <div class="role-name gm">ERES EL DM</div>
          `;
        } else {
          app.innerHTML = `
            <span class="role-label">Jugador</span>
            <div class="role-name player">${name}</div>
          `;
        }
      } catch (error) {
        app.innerText = "Error al obtener datos";
        console.error(error);
      }
    }

    // OBR.onReady se dispara cuando la extensión detecta que está dentro de Owlbear
    OBR.onReady(() => {
      console.log("SDK Local detectada y lista.");
      
      // Primera carga
      updateUI();

      // Escuchar si el jugador cambia su nombre mientras la extensión está abierta
      OBR.player.onChange(() => {
        updateUI();
      });
    });

    // Pequeño chequeo de seguridad
    setTimeout(() => {
      if (typeof OBR === 'undefined') {
        app.innerHTML = "<span style='color:red'>No se encontró obr-sdk.js al lado del index.html</span>";
      }
    }, 2000);
  </script>
</body>
</html>
