<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/@owlbear-rodeo/sdk"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="role-badge">CONECTANDO...</div>
    <h2 id="owner-name" style="font-size: 14px; margin: 5px 0;">INVENTARIO</h2>

    <div id="gm-console" class="hidden">
        <select id="player-selector" style="width: 100%; margin-bottom: 5px;"></select>
        <div style="display: flex; gap: 5px;">
            <select id="item-catalog-selector" style="flex-grow: 1;"></select>
            <button id="btn-add">DAR</button>
        </div>
    </div>

    <div class="currency-container">
        <div class="currency-field"><span>PO</span><input type="number" id="coin-gold"></div>
        <div class="currency-field"><span>PP</span><input type="number" id="coin-silver"></div>
        <div class="currency-field"><span>PC</span><input type="number" id="coin-copper"></div>
    </div>

    <div id="grid" class="inventory-grid"></div>

    <script src="./script.js"></script>
</body>
</html>
