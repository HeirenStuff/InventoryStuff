<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBR Info Fix</title>
  <style>
    body { font-family: sans-serif; color: white; background: #242424; margin: 0; padding: 10px; text-align: center; }
    #info-card { background: #333; padding: 15px; border-radius: 8px; border: 2px dashed #555; }
    .role { font-weight: bold; font-size: 1.2em; display: block; margin-bottom: 5px; }
    .gm { color: #bb86fc; }
    .player { color: #03dac6; }
    .status { font-size: 0.7em; color: #777; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="info-card">
    <div id="content">Esperando SDK...</div>
    <div id="debug-log" class="status">Cargando script...</div>
  </div>

  <!-- URL corregida para asegurar que cargue la versión de navegador (UMD) -->
  <script src="https://unpkg.com/@owlbear-rodeo/sdk@latest/dist/obr-sdk.js"></script>

  <script>
    const content = document.getElementById('content');
    const debugLog = document.getElementById('debug-log');

    function log(msg) {
      console.log(`[OBR-DEBUG]: ${msg}`);
      debugLog.innerText = msg;
    }

    // Función principal
    async function startExtension() {
      log("Iniciando OBR.onReady...");
      
      OBR.onReady(async () => {
        log("SDK conectada con Owlbear Rodeo.");
        
        const updateData = async () => {
          try {
            log("Obteniendo datos...");
            const role = await OBR.player.getRole();
            const name = await OBR.player.getName();
            log(`Datos: ${role} - ${name}`);

            if (role === "GM") {
              content.innerHTML = `<span class="role gm">ERES EL DM</span>`;
            } else {
              content.innerHTML = `
                <span class="role player">JUGADOR</span>
                <div style="font-size: 1.3em;">${name}</div>
              `;
            }
          } catch (e) {
            log("Error obteniendo datos: " + e.message);
          }
        };

        // Ejecutar y suscribir
        updateData();
        OBR.player.onChange(updateData);
      });
    }

    // Verificamos si la variable OBR existe cada 100ms hasta que cargue el script
    const checkInterval = setInterval(() => {
      log("Verificando si 'window.OBR' existe...");
      if (typeof window.OBR !== 'undefined') {
        log("¡OBR detectado!");
        clearInterval(checkInterval);
        startExtension();
      }
    }, 200);

    // Timeout por si el script falla en cargar
    setTimeout(() => {
      if (typeof window.OBR === 'undefined') {
        log("ERROR: El script de la SDK no cargó.");
        content.innerText = "Error: SDK no disponible";
      }
    }, 5000);
  </script>
</body>
</html>
