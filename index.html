<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Cargamos el SDK primero en el head -->
    <script src="https://unpkg.com/@owlbear-rodeo/sdk"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <div id="role-badge">Detectando...</div>
        <div class="coin-container"><h2 id="owner-name">INVENTARIO</h2></div>

        <div id="gm-console" class="hidden">
            <select id="player-selector"></select>
            <button id="btn-add">+ OTORGAR ITEM</button>
        </div>
        
        <div class="currency-container">
            <div class="currency-field"><span>PO:</span><input type="number" id="coin-gold"></div>
            <div class="currency-field"><span>PP:</span><input type="number" id="coin-silver"></div>
            <div class="currency-field"><span>PC:</span><input type="number" id="coin-copper"></div>
        </div>
        <div id="grid" class="inventory-grid"></div>
    </div>
    <!-- Script de lógica al final sin type="module" -->
    <script src="./script.js"></script>
</body>
</html>
