<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBR Player Info</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #242424;
      color: #eee;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    #card {
      background: #333;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #444;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      min-width: 180px;
    }
    .label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 8px; display: block; }
    .value { font-weight: bold; font-size: 1.3rem; }
    .gm { color: #bb86fc; }
    .player { color: #03dac6; }
    .error { color: #ff5555; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div id="card">
    <div id="app">Cargando Owlbear SDK...</div>
  </div>

  <!-- Usamos la URL directa al archivo UMD que define 'window.OBR' -->
  <script src="https://unpkg.com/@owlbear-rodeo/sdk@latest/dist/obr-sdk.js"></script>

  <script>
    const app = document.getElementById('app');

    // Función para actualizar la interfaz
    async function updateInfo() {
      try {
        const role = await OBR.player.getRole();
        const name = await OBR.player.getName();

        if (role === "GM") {
          app.innerHTML = `<span class="label">Rol actual</span><div class="value gm">ERES EL DM</div>`;
        } else {
          app.innerHTML = `
            <span class="label">Jugador</span>
            <div class="value player">${name}</div>
          `;
        }
      } catch (err) {
        console.error("Error al obtener datos:", err);
        app.innerHTML = `<div class="error">Error al leer datos de OBR</div>`;
      }
    }

    // Función de inicio
    function init() {
      if (typeof OBR === 'undefined') {
        app.innerHTML = `<div class="error">Error: OBR no definido.<br>Revisa la conexión.</div>`;
        return;
      }

      OBR.onReady(() => {
        updateInfo();
        // Si el jugador cambia nombre o color, se actualiza solo
        OBR.player.onChange(updateInfo);
      });
    }

    // Esperar un momento a que el script de unpkg cargue
    window.onload = init;
  </script>
</body>
</html>
