<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario RE</title>
</head>
<body style="background: #1a1a1a; color: white; font-family: sans-serif; text-align: center;">
    
    <h1 id="status">Iniciando...</h1>
    <div id="player-info"></div>

    <!-- Usamos type="module" para poder usar imports como en tu ejemplo -->
    <script type="module">
        // Importamos el SDK como un módulo de internet, igual que el "import OBR" de Svelte
        import OBR from "https://unpkg.com/@owlbear-rodeo/sdk@latest/dist/obr-sdk.js";

        const status = document.getElementById("status");
        const info = document.getElementById("player-info");

        async function start() {
            // Imita el "if (OBR.isAvailable)" de tu ejemplo
            if (OBR.isAvailable) {
                OBR.onReady(async () => {
                    const name = await OBR.player.getName();
                    const role = await OBR.player.getRole();

                    status.innerText = "¡CONECTADO!";
                    status.style.color = "#d4af37";
                    info.innerHTML = `Jugador: ${name} | Rol: ${role}`;
                    
                    console.log("Conexión establecida con éxito.");
                });
            } else {
                status.innerText = "Error: No se detecta Owlbear Rodeo";
                console.error("OBR no está disponible. ¿Estás abriendo esto fuera de Owlbear?");
            }
        }

        start();
    </script>
</body>
</html>
