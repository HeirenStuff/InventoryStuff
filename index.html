<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBR Player Info</title>
  <style>
    body { font-family: sans-serif; background: #242424; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    #card { background: #333; padding: 20px; border-radius: 10px; border: 1px solid #555; text-align: center; min-width: 200px; }
    .gm { color: #bb86fc; font-weight: bold; }
    .player { color: #03dac6; font-weight: bold; }
  </style>
</head>
<body>

  <div id="card">
    <div id="content">Cargando...</div>
  </div>

  <!-- ESTA ES LA CLAVE: Usar la versión compilada para navegador -->
  <script src="https://unpkg.com/@owlbear-rodeo/sdk@latest/dist/obr-sdk.js"></script>

  <script>
    // 1. Verificamos inmediatamente si el script cargó
    console.log("Comprobando SDK...");
    
    const content = document.getElementById('content');

    function start() {
      if (typeof OBR === 'undefined') {
        content.innerText = "Error: SDK no cargada";
        console.error("La variable OBR no existe.");
        return;
      }

      // 2. OBR.onReady solo funciona si el HTML está dentro de Owlbear Rodeo
      OBR.onReady(async () => {
        console.log("OBR listo!");
        
        const update = async () => {
          const role = await OBR.player.getRole();
          const name = await OBR.player.getName();
          
          if (role === "GM") {
            content.innerHTML = `Rol: <span class="gm">DM</span>`;
          } else {
            content.innerHTML = `Jugador: <span class="player">${name}</span>`;
          }
        };

        update();
        OBR.player.onChange(update);
      });
    }

    // Ejecutar al cargar la ventana
    window.onload = start;
  </script>
</body>
</html>
