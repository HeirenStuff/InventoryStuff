<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBR Info</title>
  <style>
    /* Estilo visual compacto */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      background: #242424;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    #info-card {
      background: #333;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #555;
      min-width: 150px;
    }
    .role {
      font-weight: bold;
      color: #bb86fc;
      display: block;
      margin-bottom: 5px;
    }
    .name {
      font-size: 1.1em;
      color: #03dac6;
    }
  </style>
</head>
<body>

  <div id="app">
    <div id="info-card">Cargando datos...</div>
  </div>

  <!-- Importamos la SDK de Owlbear Rodeo -->
  <script src="https://unpkg.com/@owlbear-rodeo/sdk"></script>

  <script>
    // Esperamos a que la SDK esté lista
    OBR.onReady(async () => {
      const app = document.getElementById('info-card');

      async function updateInfo() {
        // Obtenemos el Rol y el Nombre usando la API de Player
        const role = await OBR.player.getRole();
        const name = await OBR.player.getName();

        if (role === "GM") {
          app.innerHTML = `<span class="role">Eres el GM</span>`;
        } else {
          app.innerHTML = `
            <span class="role">Jugador</span>
            <span class="name">${name}</span>
          `;
        }
      }

      // Ejecutar al cargar
      updateInfo();

      // Opcional: Suscribirse a cambios por si el usuario cambia su nombre
      OBR.player.onChange(() => {
        updateInfo();
      });
    });
  </script>
</body>
</html>
